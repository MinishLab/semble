[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semble"
version = "0.1.0"
description = "Instant local code search for agents. Static embeddings, hybrid search, zero API keys."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "MinishLab" }]
keywords = ["code-search", "embeddings", "mcp", "model2vec", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "model2vec>=0.4.0",
    "vicinity>=0.4.0",
    "numpy>=1.24.0",
    "bm25s>=0.2.0",
    "chonkie[code]>=1.6.2",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
    "mypy>=1.0",
    "pydoclint>=0.5.3",
    "pre-commit>=3.0",
    "einops>=0.8.0",
    "sentence-transformers>=3.0",
]

[project.scripts]
semble = "semble.cli:main"

[project.urls]
Homepage = "https://github.com/MinishLab/semble"
Repository = "https://github.com/MinishLab/semble"

[tool.hatch.build.targets.wheel]
packages = ["src/semble"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
ignore_missing_imports = true

[tool.pydoclint]
style = "sphinx"
exclude = "test_"
allow-init-docstring = true
arg-type-hints-in-docstring = false
check-return-types = false
require-return-section-when-returning-nothing = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short", "--strict-markers", "--cov=src", "--cov-report=term-missing"]

[tool.coverage.report]
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "@abstractmethod"]
